services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wealthos
      POSTGRES_USER: wealthos
      POSTGRES_PASSWORD: wealthos_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - wealthos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wealthos -d wealthos"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer:6.2.0
    profiles: ["tools"]
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  wealthos-postgres:
