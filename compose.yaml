services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wealthos
      POSTGRES_USER: wealthos
      POSTGRES_PASSWORD: wealthos_local_only
    ports:
      - "5432:5432"
    volumes:
      - wealthos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wealthos -d wealthos"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  wealthos-postgres:
