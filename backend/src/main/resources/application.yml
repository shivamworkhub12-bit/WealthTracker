spring:
  application:
    name: wealthos-api
  config:
    import: optional:file:${user.home}/.config/wealthos/capture.properties
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wealthos}
    username: ${DB_USER:wealthos}
    password: ${DB_PASSWORD:wealthos_local_only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  address: 127.0.0.1
  port: ${PORT:8080}
  error:
    include-message: always
